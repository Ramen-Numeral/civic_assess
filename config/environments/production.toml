# Hugging Face deployment routes. Secrets are supplied as Space environment
# variables. Repeated role blocks are attempted from top to bottom.

[api_keys]
openai = "OPENAI_API_KEY"

[[routes.validator]]
provider = "openai"
model = "gpt-4.1-mini"
temperature = 0.0
timeout_seconds = 30
max_retries = 2

