[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-assess"
version = "0.1.0"
description = "A grounded civic-research chatbot with evidence-aware reasoning."
requires-python = ">=3.13,<3.15"
dependencies = [
    "anthropic==0.120.2",
    "gradio==6.23.1",
    "groq==0.37.1",
    "httpx==0.28.1",
    "langchain-anthropic==1.5.4",
    "langchain-core==1.5.3",
    "langchain-groq==1.1.3",
    "langchain-openai==1.4.1",
    "langgraph==1.2.9",
    "openai==2.53.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "sentence-transformers==5.7.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.2"]

[tool.setuptools.packages.find]
include = ["app*", "config*", "evals*"]
namespaces = true

[tool.setuptools.package-data]
app = ["prompts/templates/*.md", "infrastructure/persistence/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: isolated test of one production boundary",
    "integration: test combining multiple production components without a full external workflow",
    "e2e: test exercising a complete user-visible workflow",
    "live: test requiring a real provider or external service",
    "evaluation: test assessing application output quality or behavior",
    "security: test of a security control or trust boundary",
    "smoke: small test checking that a critical path starts or assembles successfully",
    "regression: test preserving behavior for a previously discovered defect",
]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = ["to_do", "evals/reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
