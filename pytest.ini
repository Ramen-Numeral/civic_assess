[pytest]
testpaths = tests
markers =
    unit: isolated test of one production boundary
    integration: test combining multiple production components without a full external workflow
    e2e: test exercising a complete user-visible workflow
    live: test requiring real internet, provider, database, or external-service access
    slow: test intentionally excluded from fast feedback because of material runtime
    evaluation: test assessing application output quality or behavior
    security: test of a security control, trust boundary, secret handling, or known weakness
    smoke: small test checking that a critical path starts or assembles successfully
    regression: test preserving behavior for a previously discovered defect
    performance: test measuring speed, throughput, memory, or another resource target
addopts = --strict-markers
